<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting Twitch…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111113;
      color: #f0f0f4;
      font-family: 'Geist', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 14px;
    }
    .icon  { font-size: 44px; }
    .title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .sub   { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6a6a7a; text-align: center; max-width: 320px; }
    .error { color: #ff5555; }
  </style>
</head>
<body>
  <div class="icon" id="icon">⏳</div>
  <div class="title" id="title">Connecting Twitch…</div>
  <div class="sub"   id="sub"></div>
  <script>
    // Implicit grant returns token in URL hash fragment
    const hash   = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token  = params.get('access_token');
    const error  = params.get('error');

    if (error) {
      document.getElementById('icon').textContent  = '✗';
      document.getElementById('title').textContent = 'Connection cancelled';
      document.getElementById('sub').textContent   = params.get('error_description') || error;
      document.getElementById('sub').classList.add('error');
      setTimeout(() => { window.location.href = 'index.html'; }, 2500);
    } else if (token) {
      localStorage.setItem('twitch_oauth_token', token);
      document.getElementById('icon').textContent  = '✓';
      document.getElementById('title').textContent = 'Twitch connected!';
      document.getElementById('sub').textContent   = 'Returning to Highlight Hunter…';
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
    } else {
      document.getElementById('icon').textContent  = '✗';
      document.getElementById('title').textContent = 'No token received';
      document.getElementById('sub').textContent   = 'Something went wrong. Try connecting again.';
      document.getElementById('sub').classList.add('error');
      setTimeout(() => { window.location.href = 'index.html'; }, 2500);
    }
  </script>
</body>
</html>
